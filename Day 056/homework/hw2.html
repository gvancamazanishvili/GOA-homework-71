<!-- 2) CSS_ის ფაილში კომენტარის სახით ჩამოწერეთ დღეს ნასწავლი Flexbox-ის კუთვნილებები. ახსენით რა დანიშნულება აქვს:
    • Display კუთვნილებას;
    • Justify-content კუთვნილებას;
    • Align-items კუთვნილებას;

    Display -- flex - განალაგებს ელემენტებს ჰორიზინტალურად ზევითა მარჯვენა კუთხეში
    Display -- block - გარდაქმნის inline ელემენტებს block ელემენტებად
    Display -- inline - გარდაქმნის block ელემენტებს inline ელემენტებად


    Justify-content --   baseline, start -- განალაგებს ელემენტებს parent ელემენტის  თავში
    Justify-content --   end -- განალაგებს ელემენტებს parent ელემენტის  ბოლოში
    Justify-content --   right  -- განალაგებს ელემენტებს parent ელემენტის   ზედა მარჯვენა კუთხეში
    Justify-content --   left -- განალაგებს ელემენტებს parent ელემენტის   ზედა მარცხენა კუთხეში
    Justify-content --   end -- განალაგებს ელემენტებს parent ელემენტის    ქვემოთა მარცხენა მხარეს 
    Justify-content --   center -- განალაგებს ელემენტებს parent ელემენტის  ცენტრში
    Justify-content --   space-around -- ელემენტებს აქვთ ცალცაკლე საკუთარი padding 
    Justify-content --   space-between -- ელემენტებს შორის არის თანაბარი padding
    Justify-content --   space-evenly -- parent ელემენტის კედლიდან და ელემენტებს შორის არის თანაბარი დაშორება


    Align-items - baseline, start -- განალაგებს ელემენტებს parent ელემენტის  თავში
    Align-items - center -- განალაგებს ელემენტებს parent ელემენტის  ცენტრში -->
