<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <div id="ratingScreen">
        <div id="starDiv">
            <img src="./images/icon-star.svg" alt="" id="star">
        </div>
        <h1>How did we do?</h1>
        <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
        <div id="buttons">
            <button class="ratingBtn">1</button>
            <button class="ratingBtn">2</button>
            <button class="ratingBtn">3</button>
            <button class="ratingBtn">4</button>
            <button class="ratingBtn">5</button>
        </div>

        <button id="submit" type="submit">SUBMIT</button>
    </div>

    <div id="thanyouScreen" style="display: none;">
        <div id="img">
            <img src="./images/illustration-thank-you.svg" alt="" id="thx">

            <h1>Thank you!</h1>
            <p>  We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
        </div>
    </div>
</body>
</html>
