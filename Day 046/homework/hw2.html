    <!-- text-decoration -dashed - წყვეტილი ხაზები 
    double - ორი ხაზი
    solid - საწყისი მნიშვნელობა, ჩოულებრივი ხაზი
    dotted - წერტილოვანი
    wavy - ტალღოვანი ხაზები
    overline - ზედა ხაზი
    underline - ქვედა ხაზი
    line-through - ტექსტს ხაზს უსვამს შუაში
    none - ტექსტს აშორებს ტეკორაციებს 
    text-shadow - ტექსტის ჩრდილი
    text-transform - განაპირობებს როგორ დაიწერება ტექსტი
    text-decoration - აძლევს ტექსტს სხვადასხვა დეკორაციებს
    capitalize - პირველი ასოს ადიდებს ხოლო დანარჩენი პატარა ასოებით იწერება
    uppercase -  ყველა ასოს ადიდებს, დიდი შრიფტით წერს
    lowercase- ყველა ასო იწერება პატარა ასოებით
    color - ფერს უცვლის ტექსტს
    blur radius - დაბურული რადიუსი 
    font-size - ტექსტს უცვლის ზომას (px, %, large, small..) 
    text align - ტექსტს უცვლის ადგილს (center, left, right,  justify)
    font-family - განაპირობებს სხვადასხვა შრიფროს სტილს  
    font-weight - ამუქებს ტექსტს -->
