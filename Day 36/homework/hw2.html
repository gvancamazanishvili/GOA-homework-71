<!-- CSS - ატვს სამი გასტილვის სახე. inline, internal, external.

internal CSS - როდესაც ელემენტებს ვსტილავთ HTML -ის დოკუმენტში, head თეგში. მას აუცილებლად სჭირდება style ატრიბუტი და სელექტორი, ანუ ის თეგი რომლის გასტილვაც გვინდა.

external CSS - ვქნით ცალკეულ ფაილს სადაც მოვათავსებთ ყველანაირ გასტილვას. ინტერნალის მსგავსად მას სჭირდება სელექტორი. ფაილის ბოლოს იწერება .css -->
